<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#223d56">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <title>阿卢工作台</title>
  <style>
    :root {
      --cream: #f5f1e8;
      --paper: #fffdf8;
      --ink: #1e2a32;
      --muted: #78837e;
      --line: #e2ded2;
      --navy: #223d56;
      --navy-soft: #dfe9ef;
      --green: #719f63;
      --green-soft: #e5eedc;
      --purple: #8b76a9;
      --purple-soft: #ebe4f2;
      --orange: #d38a4b;
      --orange-soft: #f5e5d4;
      --blue: #4c92a7;
      --blue-soft: #dcecef;
      --shadow: 0 18px 50px rgba(32, 48, 56, .08);
      --display: Georgia, "Songti SC", "STSong", serif;
      --body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--cream); }
    body { margin: 0; color: var(--ink); background: radial-gradient(circle at 80% 0%, rgba(198, 215, 202, .32), transparent 30%), var(--cream); font-family: var(--body); -webkit-font-smoothing: antialiased; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
    .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 26px; padding: 22px 16px; border-right: 1px solid rgba(34, 61, 86, .12); background: rgba(249, 247, 240, .88); backdrop-filter: blur(16px); }
    .brand { display: flex; align-items: center; gap: 12px; padding: 4px 6px 17px; border-bottom: 1px solid var(--line); }
    .brand-mark, .nav-avatar, .dept-avatar { display: grid; place-items: center; overflow: hidden; border-radius: 18px; background: rgba(226, 233, 218, .82); }
    .brand-mark { width: 58px; height: 58px; flex: 0 0 58px; }
    .brand-mark img, .nav-avatar img, .dept-avatar img, .module-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center center; mix-blend-mode: multiply; }
    .brand-mark img { transform: scale(1.08); }
    .brand h1 { margin: 0; font-family: var(--display); font-size: 25px; font-weight: 500; letter-spacing: -.06em; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .nav-label { padding: 0 10px 8px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .16em; }
    .main-nav { display: grid; gap: 4px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; border-radius: 15px; color: var(--muted); background: transparent; text-align: left; transition: .2s ease; }
    .nav-item:hover { color: var(--navy); background: rgba(229, 238, 220, .72); }
    .nav-item.active { color: var(--navy); background: var(--green-soft); font-weight: 800; }
    .nav-avatar { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 12px; background: rgba(231, 236, 226, .86); }
    .nav-item .nav-copy { min-width: 0; flex: 1; }
    .nav-item strong { display: block; font-size: 13px; }
    .nav-item small { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }
    .nav-item .nav-count { color: var(--muted); font-size: 10px; }
    .sidebar-bottom { margin-top: auto; display: grid; gap: 10px; }
    .local-card { padding: 12px; border-radius: 15px; background: #eeeae0; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .local-card strong { display: block; margin-bottom: 3px; color: var(--navy); font-size: 12px; }
    .backend-status { padding: 9px 11px; border-radius: 12px; background: #eeece5; color: var(--muted); font-size: 10px; }
    .backend-status.ready { color: #356444; background: var(--green-soft); }
    .backend-status.fallback { color: #855333; background: var(--orange-soft); }
    .main { min-width: 0; padding: 29px clamp(18px, 4vw, 62px) 70px; }
    .topbar { display: flex; justify-content: space-between; align-items: start; gap: 18px; margin-bottom: 28px; }
    .eyebrow, .section-label { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .16em; }
    .topbar h2 { margin: 8px 0 0; font-family: var(--display); font-size: clamp(35px, 5vw, 60px); font-weight: 500; line-height: .98; letter-spacing: -.07em; }
    .topbar h2 em { color: var(--orange); font-style: normal; }
    .topbar p { max-width: 560px; margin: 13px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .pill, .ghost-btn, .primary-btn { border: 1px solid var(--line); border-radius: 999px; padding: 10px 14px; color: var(--ink); background: var(--paper); font-size: 12px; white-space: nowrap; }
    .pill { color: var(--muted); }
    .ghost-btn:hover, .pill:hover { border-color: var(--green); color: var(--navy); }
    .primary-btn { border-color: var(--green); background: var(--green); color: white; box-shadow: 0 5px 0 rgba(63, 93, 65, .13); }
    .primary-btn:hover { background: #507a52; }
    .compact { padding: 8px 11px; font-size: 11px; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(230px, .78fr); gap: 18px; }
    .hero, .side-stat, .panel, .module-card { border: 1px solid rgba(34, 61, 86, .1); border-radius: 26px; background: rgba(255, 253, 248, .88); box-shadow: var(--shadow); }
    .hero { min-height: 250px; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(22px, 3.5vw, 38px); position: relative; overflow: hidden; }
    .hero:after { content: ""; position: absolute; width: 230px; height: 230px; right: -72px; top: -86px; border: 1px solid rgba(113, 159, 99, .24); border-radius: 50%; box-shadow: 0 0 0 23px rgba(113, 159, 99, .07), 0 0 0 48px rgba(113, 159, 99, .045); }
    .hero-kicker { color: var(--muted); font-size: 12px; }
    .hero h3 { max-width: 650px; margin: 13px 0 0; font-family: var(--display); font-size: clamp(30px, 4vw, 48px); font-weight: 500; line-height: 1.07; letter-spacing: -.055em; }
    .hero h3 span { color: var(--green); }
    .hero-foot { display: flex; align-items: center; gap: 18px; margin-top: 26px; }
    .hero-foot strong { display: block; font-family: var(--display); font-size: 21px; font-weight: 500; }
    .hero-foot small { color: var(--muted); font-size: 11px; }
    .progress-bar { height: 8px; flex: 1; overflow: hidden; border-radius: 99px; background: #e8e5da; }
    .progress-bar i { display: block; height: 100%; border-radius: inherit; background: var(--green); transition: width .25s ease; }
    .side-stat { padding: 25px; color: #f5f5ee; background: var(--navy); position: relative; overflow: hidden; }
    .side-stat:after { content: ""; position: absolute; right: -75px; bottom: -85px; width: 220px; height: 220px; border: 1px solid rgba(255,255,255,.22); border-radius: 50%; box-shadow: 0 0 0 24px rgba(255,255,255,.05), 0 0 0 50px rgba(255,255,255,.04); }
    .side-stat p { margin: 0; color: rgba(245,245,238,.68); font-size: 12px; }
    .side-stat strong { display: block; margin-top: 23px; font-family: var(--display); font-size: 62px; font-weight: 500; line-height: .8; }
    .side-stat strong small { font-family: var(--body); font-size: 14px; color: rgba(245,245,238,.68); }
    .mini-bars { display: flex; align-items: end; gap: 7px; height: 44px; margin-top: 31px; }
    .mini-bars i { width: 12px; height: 20px; border-radius: 5px 5px 0 0; background: rgba(255,255,255,.27); }
    .mini-bars i:nth-child(3), .mini-bars i:nth-child(4), .mini-bars i:nth-child(7) { height: 40px; background: #cfe5bf; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 35px 0 14px; }
    .section-head h3 { margin: 6px 0 0; font-family: var(--display); font-size: 30px; font-weight: 500; letter-spacing: -.05em; }
    .section-head p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .panel { padding: 19px; border-radius: 20px; box-shadow: none; }
    .week-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    .week-day { min-height: 82px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 11px 7px 9px; border: 1px solid var(--line); border-radius: 15px; background: #f7f4ec; }
    .week-day small { color: var(--muted); font-size: 10px; font-weight: 800; }
    .week-day strong { font-family: var(--display); font-size: 24px; font-weight: 500; }
    .week-day i { width: 8px; height: 8px; border-radius: 50%; background: #d5d8cf; }
    .week-day i.on { background: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
    .week-day.today { border-color: var(--green); background: var(--green-soft); }
    .week-day.today small { color: #477248; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .panel-head strong { font-size: 14px; }
    .panel-head span { color: var(--muted); font-size: 11px; }
    .task-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(250px, .75fr); gap: 18px; }
    .task-list { display: grid; }
    .task-row { display: grid; grid-template-columns: 25px minmax(0, 1fr) auto; align-items: center; gap: 11px; min-height: 70px; border-bottom: 1px solid #ece9e0; }
    .task-row:last-child { border-bottom: 0; }
    .check { width: 23px; height: 23px; padding: 0; border: 1px solid #bec6b7; border-radius: 50%; background: transparent; }
    .task-row.done .check { border-color: var(--green); background: var(--green); }
    .task-row.done .check:after { content: "✓"; color: white; font-weight: 800; }
    .task-row.done .task-title { color: #a0a6a0; text-decoration: line-through; }
    .task-title { font-size: 14px; font-weight: 750; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .task-tag { color: var(--green); font-weight: 700; }
    .priority { width: 7px; height: 7px; display: inline-block; border-radius: 50%; background: #b9c0b5; }
    .priority.high { background: var(--orange); }
    .priority.medium { background: var(--green); }
    .task-actions { display: flex; align-items: center; gap: 2px; }
    .task-actions button { border: 0; padding: 5px; color: var(--muted); background: transparent; font-size: 11px; }
    .task-actions button:hover { color: var(--navy); }
    .task-actions .remove:hover { color: var(--orange); }
    .empty { padding: 30px 14px; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.7; }
    .quick-panel { border-color: transparent; background: #eaf0e6; }
    .quick-list { display: grid; gap: 5px; max-height: 350px; overflow: auto; }
    .quick-group { margin: 12px 5px 4px; color: var(--navy); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
    .quick-item { display: grid; grid-template-columns: 18px minmax(0, 1fr) 17px; align-items: start; gap: 8px; padding: 8px 6px; border-radius: 10px; }
    .quick-item:hover { background: rgba(255,255,255,.65); }
    .quick-item input { margin-top: 3px; accent-color: var(--green); }
    .quick-item label { font-size: 12px; line-height: 1.35; cursor: pointer; }
    .quick-item small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .x-button { border: 0; padding: 0; color: #b3bdb0; background: transparent; font-size: 17px; }
    .x-button:hover { color: var(--orange); }
    .dept-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .dept-card { min-height: 175px; display: flex; flex-direction: column; justify-content: space-between; padding: 17px; border: 1px solid var(--line); border-radius: 21px; text-align: left; transition: .2s ease; }
    .dept-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .dept-card .dept-avatar { width: 66px; height: 66px; border-radius: 21px; background: rgba(255,255,255,.68); }
    .dept-card .dept-avatar img { transform: scale(1.05); }
    .dept-card.art-card .dept-avatar img { transform: scale(1.14); }
    .dept-card h4 { margin: 13px 0 3px; font-size: 15px; }
    .dept-card p { margin: 0; color: var(--muted); font-size: 11px; }
    .dept-card .card-foot { margin-top: 14px; color: var(--navy); font-size: 11px; font-weight: 800; }
    .office { background: #f3ecdf; }
    .finance { background: #e8eee8; }
    .education { background: #e9eff1; }
    .health { background: #e8efe0; }
    .development { background: #e7edf2; }
    .culture { background: #f4e7dc; }
    .dept-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .module-card { min-height: 174px; padding: 18px; box-shadow: none; border-radius: 20px; text-align: left; transition: .2s ease; }
    .module-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .module-top { display: flex; align-items: start; justify-content: space-between; gap: 9px; }
    .module-avatar { width: 48px; height: 48px; display: grid; place-items: center; overflow: hidden; border-radius: 15px; background: var(--green-soft); font-size: 25px; }
    .module-card h4 { margin: 16px 0 4px; font-family: var(--display); font-size: 23px; font-weight: 500; letter-spacing: -.04em; }
    .module-card p { min-height: 34px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .module-card .module-foot { display: flex; justify-content: space-between; align-items: center; gap: 7px; margin-top: 16px; color: var(--green); font-size: 11px; font-weight: 800; }
    .module-card .module-foot span:last-child { color: var(--muted); font-weight: 500; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .metric { padding: 13px; border-radius: 14px; background: #f1efe7; }
    .metric small { display: block; color: var(--muted); font-size: 10px; }
    .metric strong { display: block; margin-top: 6px; font-family: var(--display); font-size: 26px; font-weight: 500; }
    .metric input { width: 100%; border: 0; padding: 2px 0; outline: 0; color: var(--ink); background: transparent; font-family: var(--display); font-size: 25px; }
    .metric .unit { color: var(--muted); font-family: var(--body); font-size: 10px; }
    .split-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .water-head { display: flex; justify-content: space-between; align-items: end; gap: 10px; }
    .water-head strong { font-family: var(--display); font-size: 39px; font-weight: 500; }
    .water-head span { color: var(--muted); font-size: 11px; }
    .water-cups { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin: 14px 0; }
    .cup { height: 29px; padding: 0; border: 1px solid #bfd2b5; border-radius: 7px 7px 11px 11px; background: #f8f8f2; }
    .cup.filled { border-color: var(--green); background: var(--green); }
    .water-actions { display: flex; gap: 8px; }
    .water-actions button { flex: 1; }
    .meal-list { display: grid; gap: 4px; }
    .meal { display: flex; align-items: center; gap: 9px; padding: 10px 0; border-bottom: 1px solid #ece9e0; color: var(--muted); font-size: 12px; }
    .meal:last-child { border-bottom: 0; }
    .meal input { accent-color: var(--green); }
    .goal-list, .book-list, .idea-list, .resource-list { display: grid; gap: 9px; }
    .goal-item, .book-item, .idea-item { padding: 13px; border-radius: 14px; background: #f1efe7; }
    .goal-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .goal-item strong, .book-item strong, .idea-item strong { font-size: 13px; }
    .goal-item p, .book-item p, .idea-item p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .goal-progress { margin-top: 9px; }
    .goal-progress .progress-bar { height: 6px; }
    .goal-progress small { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; }
    .book-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .book-progress { margin-top: 8px; }
    .book-progress .progress-bar { height: 6px; }
    .book-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .radar-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .radar-intro { margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .capture { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 13px; }
    .capture input { min-width: 0; width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; outline: 0; background: white; }
    .capture input:focus, .form-field input:focus, .form-field textarea:focus, .form-field select:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .idea-item .idea-source { color: var(--orange); font-size: 10px; font-weight: 800; }
    .idea-item b { color: var(--navy); }
    .placeholder { min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; border: 1px dashed #c9cfc7; border-radius: 20px; color: var(--muted); text-align: center; }
    .placeholder strong { color: var(--navy); font-family: var(--display); font-size: 25px; font-weight: 500; }
    .placeholder p { max-width: 430px; margin: 10px 0 0; font-size: 12px; line-height: 1.65; }
    .placeholder span { margin-top: 15px; padding: 7px 10px; border-radius: 99px; color: #855333; background: var(--orange-soft); font-size: 10px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 17px; background: rgba(24, 37, 43, .38); backdrop-filter: blur(8px); }
    .modal { width: min(570px, 100%); max-height: min(810px, 94vh); overflow: auto; padding: 23px; border-radius: 24px; background: var(--paper); box-shadow: 0 30px 90px rgba(24, 37, 43, .22); }
    .modal-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .modal-head h3 { margin: 0; font-family: var(--display); font-size: 29px; font-weight: 500; letter-spacing: -.05em; }
    .close { border: 0; padding: 0; color: var(--muted); background: transparent; font-size: 25px; }
    .form-grid { display: grid; gap: 13px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .form-field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; }
    .form-field input, .form-field textarea, .form-field select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; outline: 0; color: var(--ink); background: white; }
    .form-field textarea { min-height: 92px; resize: vertical; }
    .modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .detail-note { padding: 12px; border-radius: 13px; color: var(--navy); background: var(--navy-soft); font-size: 11px; line-height: 1.6; }
    .reader { padding: 20px; border-radius: 17px; background: #f7f2e7; }
    .reader p { margin: 0; color: #555c57; font-family: var(--display); font-size: 18px; line-height: 1.85; }
    .toast { position: fixed; z-index: 70; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 11px 15px; border-radius: 99px; color: white; background: var(--navy); box-shadow: var(--shadow); font-size: 12px; }
    .mobile-nav { display: none; }
    @media (max-width: 1100px) {
      .shell { grid-template-columns: 215px minmax(0, 1fr); }
      .dept-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      .dashboard-grid, .task-layout, .split-grid { grid-template-columns: 1fr; }
      .dept-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      body { padding-bottom: 74px; }
      .shell { display: block; }
      .sidebar { position: sticky; z-index: 20; top: 0; width: 100%; height: auto; display: block; padding: max(11px, env(safe-area-inset-top)) 14px 11px; border-right: 0; border-bottom: 1px solid rgba(34, 61, 86, .12); }
      .brand { padding: 0 2px 10px; border-bottom: 0; }
      .brand-mark { width: 42px; height: 42px; flex-basis: 42px; border-radius: 14px; }
      .brand h1 { font-size: 21px; }
      .brand p { font-size: 10px; }
      .sidebar > .nav-label, .sidebar > .main-nav, .sidebar-bottom { display: none; }
      .mobile-nav { position: fixed; z-index: 30; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding: 8px 5px max(8px, env(safe-area-inset-bottom)); border-top: 1px solid rgba(34,61,86,.12); background: rgba(249,247,240,.95); backdrop-filter: blur(15px); }
      .mobile-nav .nav-item { min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 3px 2px; border-radius: 11px; text-align: center; }
      .mobile-nav .nav-avatar { width: 31px; height: 31px; flex-basis: 31px; border-radius: 10px; }
      .mobile-nav .nav-copy strong { overflow: hidden; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
      .mobile-nav .nav-copy small, .mobile-nav .nav-count { display: none; }
      .main { padding: 22px 14px 35px; }
      .topbar { display: block; margin-bottom: 22px; }
      .topbar h2 { font-size: 39px; }
      .top-actions { justify-content: flex-start; margin-top: 15px; }
      .hero { min-height: 220px; padding: 23px; }
      .hero h3 { font-size: 32px; }
      .hero-foot { align-items: start; flex-direction: column; gap: 9px; }
      .progress-bar { width: 100%; }
      .side-stat { min-height: 148px; }

    const departments = [
      { id: "office", title: "办公厅", subtitle: "日程统筹", char: "art", color: "office", desc: "把今天最重要的事安排清楚", modules: [] },
      { id: "health", title: "卫健委", subtitle: "身体健康", char: "randy", color: "health", desc: "身体档案、运动与饮食饮水", modules: ["身体档案", "运动管理", "饮食饮水"] },
      { id: "education", title: "教育部", subtitle: "学业进度", char: "mike", color: "education", desc: "英语、阅读与学习项目", modules: ["英语学习", "阅读进度", "学习项目"] },
      { id: "development", title: "发改委", subtitle: "长期发展", char: "sully", color: "development", desc: "目标、自媒体与长期项目", modules: ["长期目标", "自媒体"] },
      { id: "finance", title: "财政部", subtitle: "金钱管理", char: "scott", color: "finance", desc: "收入、支出与储蓄目标", modules: ["收支记录", "月度预算", "储蓄目标"] },
      { id: "culture", title: "文旅部", subtitle: "休息娱乐", char: "terri", color: "culture", desc: "吃喝玩乐与生活资料", modules: ["美食生活", "出行攻略", "休息娱乐"] }
    ];
    const moduleIcons = { "收支记录": "￥", "月度预算": "▣", "储蓄目标": "↗", "英语学习": "A", "阅读进度": "▤", "学习项目": "□", "身体档案": "＋", "运动管理": "↗", "饮食饮水": "○", "长期目标": "◎", "自媒体": "◌", "美食生活": "◇", "出行攻略": "↗", "休息娱乐": "○" };
    const moduleDesc = {

      "月度预算": "看清本月预算和已使用额度",
      "储蓄目标": "为大额支出或长期储蓄设定进度",
      "英语学习": "听力、单词、口语和输入闭环",
      "阅读进度": "导入书籍、继续阅读、留下笔记",
      "学习项目": "课程、考试和长期学习项目",
      "身体档案": "身高、体重、BMI、体脂和趋势",
      "运动管理": "月度目标拆成周计划和日任务",
      "饮食饮水": "记录饮水、三餐与身体感受",
      "长期目标": "年度目标、季度重点和具体项目",
      "自媒体": "灵感雷达、内容拆解和创作流程",

    };
    const seedTasks = [
      { id: "english", department: "education", title: "英语输入 20 分钟", detail: "听力 / 单词 / 口语任选一个闭环", tag: "英语学习", priority: "high", repeat: "daily" },
      { id: "reading", department: "education", title: "阅读 30 分钟", detail: "读完后记录一个可复述的观点", tag: "阅读进度", priority: "medium", repeat: "daily" },
      { id: "cycling", department: "health", title: "骑行或快走 30 分钟", detail: "低门槛启动，保持身体在线", tag: "运动管理", priority: "medium", repeat: "weekly" },
      { id: "water", department: "health", title: "喝水 8 杯", detail: "用水杯打卡，不靠意志力硬记", tag: "饮食饮水", priority: "medium", repeat: "daily" },
      { id: "media", department: "development", title: "拆解 1 条内容灵感", detail: "记录开头、结构和可改编角度", tag: "自媒体", priority: "high", repeat: "weekly" }
    ];
    const defaultState = {
      activeDepartment: "office",
      tasks: seedTasks.map((task, index) => ({ ...task, selectedDates: index < 5 ? [today()] : [], doneDates: [] })),
      trash: [],
      metrics: { height: 153, weight: 50.5, bodyFat: "", targetWeight: "" },
      water: { [today()]: 0 },
      meals: { [today()]: [false, false, false] },
      inspirations: [],
      books: [],
      goals: [{ id: "goal-1", title: "建立稳定的内容创作节奏", status: "进行中", progress: 20, note: "每周完成一次内容复盘，并逐步形成自己的风格档案" }],
      onboardingDone: false
    };
    let state = loadState();
    let modal = null;
    let toastTimer = null;
    let backendStatus = "解析服务检测中…";
    let backendClass = "";
    let deferredInstallPrompt = null;

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return clone(defaultState);
        return {
          ...clone(defaultState), ...saved,
          tasks: Array.isArray(saved.tasks) ? saved.tasks : clone(defaultState.tasks),
          trash: Array.isArray(saved.trash) ? saved.trash : [],
          metrics: { ...defaultState.metrics, ...(saved.metrics || {}) },
          water: saved.water || defaultState.water,
          meals: saved.meals || defaultState.meals,
          inspirations: Array.isArray(saved.inspirations) ? saved.inspirations : [],
          books: Array.isArray(saved.books) ? saved.books : [],
          goals: Array.isArray(saved.goals) ? saved.goals : clone(defaultState.goals)
        };
      } catch (_) { return clone(defaultState); }
    }
    function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function setState(mutator) { mutator(state); persist(); render(); }
    function department(id) { return departments.find(item => item.id === id) || departments[0]; }
    function image(name, className) { return '<img class="' + (className || "") + '" src="' + assetPath + name + '.png" alt="">'; }
    function avatar(dept) { return image(dept.char, "character"); }
    function escapeHtml(value) { return String(value == null ? "" : value).replace(/[&<>'"]/g, function(char) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", "\"": "&quot;" })[char]; }); }
    function showToast(message) {
      clearTimeout(toastTimer);
      const existing = document.querySelector(".toast");
      if (existing) existing.remove();
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);
      toastTimer = setTimeout(() => toast.remove(), 2400);
    }
    async function api(path, options) {
      const base = window.WORKBENCH_API_BASE || "";
      const response = await fetch(base + path, { headers: { "Content-Type": "application/json" }, ...(options || {}) });
      if (!response.ok) throw new Error("request_failed");
      return response.json();
    }
    async function checkBackend() {
      try {
        const result = await api("/api/health");
        backendStatus = result.modelConfigured ? "解析服务可用 · AI 深度解析" : "解析服务可用 · 规则回退";
        backendClass = "ready";
      } catch (_) {
        backendStatus = "本地模式 · 后端未连接";
        backendClass = "fallback";
      }
      render();
    }
    function completedToday(task) { return (task.doneDates || []).includes(today()); }
    function selectedToday(task) { return (task.selectedDates || []).includes(today()) || (!task.selectedDates && task.repeat === "daily"); }
    function todayTasks() { return state.tasks.filter(selectedToday); }
    function progress() {
      const list = todayTasks();
      return { total: list.length, completed: list.filter(completedToday).length };
    }
    function priorityLabel(priority) { return ({ high: "高", medium: "中", low: "低" })[priority] || "低"; }
    function repeatLabel(repeat) { return ({ daily: "每天", weekly: "每周", monthly: "每月", none: "一次性" })[repeat] || "一次性"; }
    function navItem(dept, mobile) {
      const p = dept.id === "office" ? progress() : { total: state.tasks.filter(task => task.department === dept.id).length, completed: 0 };
      return '<button class="nav-item ' + (state.activeDepartment === dept.id ? "active" : "") + '" data-nav="' + dept.id + '"><span class="nav-avatar">' + avatar(dept) + '</span><span class="nav-copy"><strong>' + dept.title + '</strong><small>' + dept.subtitle + '</small></span><span class="nav-count">' + (dept.id === "office" ? p.completed + "/" + p.total : dept.modules.length) + '</span></button>';
    }
    function shell() {
      const office = department("office");
      return '<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">' + image("mike", "character") + '</span><div><h1>阿卢工作台</h1><p>个人生活 · 工作 · 成长</p></div></div><div class="nav-label">部门导航</div><nav class="main-nav">' + departments.map(navItem).join("") + '</nav><div class="sidebar-bottom"><div class="local-card"><strong>本地测试版</strong>数据保存在当前浏览器。联网后可调用解析服务。</div><div class="backend-status ' + backendClass + '">' + backendStatus + '</div><button class="ghost-btn" data-action="settings">设置与数据</button></div></aside><main class="main">' + renderMain() + '</main><nav class="mobile-nav">' + departments.map(item => navItem(item, true)).join("") + '</nav></div>';
    }
    function render() { document.getElementById("app").innerHTML = shell() + (modal ? renderModal() : ""); bindEvents(); }
    function renderMain() {
      const dept = department(state.activeDepartment);
      if (dept.id === "office") return renderOffice();
      return renderDepartment(dept);
    }
    function renderTop(dept, kicker, title, description) {
      return '<header class="topbar"><div><div class="eyebrow">' + kicker + '</div><h2>' + title + '</h2><p>' + description + '</p></div><div class="top-actions"><span class="pill">' + dateText() + '</span><button class="ghost-btn" data-action="reset">↻ 今天重置</button><button class="primary-btn" data-action="add-task">＋ 新增任务</button></div></header>';
    }
    function renderOffice() {
      const p = progress();
      const percent = p.total ? Math.round(p.completed / p.total * 100) : 0;
      return renderTop(department("office"), "01 · 办公厅 / 日程统筹", "今天，先完成最重要的一件事。", "把六个部门的长期方向，收束成今天真正要做的几件事。") +
        '<section class="dashboard-grid"><article class="hero"><div><div class="hero-kicker">DAILY FOCUS · 有计划的一天</div><h3>完成度 <span>' + percent + '%</span>，给自己留一点余地。</h3></div><div class="hero-foot"><div><strong>' + p.completed + ' / ' + p.total + '</strong><small> 今日任务已完成</small></div><div class="progress-bar"><i style="width:' + percent + '%"></i></div></div></article><article class="side-stat"><p>连续完成</p><strong>' + streak() + '<small> 天</small></strong><div class="mini-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p>稳定推进，比爆发更重要</p></article></section>' +
        '<section><div class="section-head"><div><div class="section-label">02 · 今日安排</div><h3>今日任务</h3></div><button class="ghost-btn compact" data-action="pick-tasks">挑选今日任务 ↗</button></div><div class="task-layout"><div class="panel"><div class="panel-head"><strong>我的清单</strong><span>' + p.completed + ' 项已完成</span></div><div class="task-list">' + renderTasks() + '</div></div><div class="panel quick-panel"><div class="panel-head"><strong>任务库</strong><span>勾选加入今天</span></div><div class="quick-list">' + renderQuickTasks() + '</div><button class="primary-btn compact" style="width:100%;margin-top:13px" data-action="add-task">＋ 建一个新任务</button></div></div></section>' +
        '<section><div class="section-head"><div><div class="section-label">03 · 本周一瞥</div><h3>一周节奏</h3></div><p>先看趋势，不追求每天满分。</p></div><div class="panel"><div class="week-strip">' + renderWeekStrip() + '</div></div></section>';
    }
    function streak() {
      const days = [];
      for (let i = 0; i < 7; i++) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        days.push(date.toISOString().slice(0, 10));
      }
      let count = 0;
      for (const date of days) {
        const done = state.tasks.some(task => (task.doneDates || []).includes(date));
        if (!done && count > 0) break;
        if (done) count++;
      }
      return count;
    }
    function renderWeekStrip() {
      const names = ["日", "一", "二", "三", "四", "五", "六"];
      return Array.from({ length: 7 }, function(_, index) {
        const date = new Date();
        date.setDate(date.getDate() - (6 - index));
        const key = date.toISOString().slice(0, 10);
        const done = state.tasks.some(task => (task.doneDates || []).includes(key));
        return '<div class="week-day ' + (key === today() ? "today" : "") + '"><small>' + names[date.getDay()] + '</small><strong>' + date.getDate() + '</strong><i class="' + (done ? "on" : "") + '"></i></div>';
      }).join("");
    }
    function renderTasks() {
      const list = todayTasks();
      if (!list.length) return '<div class="empty">今天还没有任务。<br>从右侧任务库勾选，或新增一个小动作。</div>';

        return '<div class="task-row ' + (completedToday(task) ? "done" : "") + '"><button class="check" data-task="' + task.id + '" aria-label="完成任务"></button><div><div class="task-title">' + escapeHtml(task.title) + '</div><div class="task-meta"><span class="task-tag">' + escapeHtml(task.tag || department(task.department).title) + '</span><span>·</span><span>' + escapeHtml(task.detail) + '</span><span>·</span><span><i class="priority ' + task.priority + '"></i> ' + priorityLabel(task.priority) + '</span>' + (task.dueDate ? '<span>· 截止 ' + escapeHtml(task.dueDate) + '</span>' : "") + '</div></div><div class="task-actions"><button data-edit-task="' + task.id + '">编辑</button><button class="remove" data-remove="' + task.id + '">×</button></div></div>';
      }).join("");
    }
    function renderQuickTasks() {
      return departments.filter(item => item.id !== "office").map(function(dept) {
        const tasks = state.tasks.filter(task => task.department === dept.id);
        if (!tasks.length) return "";
        return '<div class="quick-group">' + dept.title + ' · ' + dept.subtitle + '</div>' + tasks.map(function(task) {
          return '<div class="quick-item"><input type="checkbox" id="quick-' + task.id + '" data-select="' + task.id + '" ' + (selectedToday(task) ? "checked" : "") + '><label for="quick-' + task.id + '">' + escapeHtml(task.title) + '<small>' + escapeHtml(task.detail) + '</small></label><button class="x-button" data-delete-task="' + task.id + '" title="移入回收站">×</button></div>';
        }).join("");
      }).join("") || '<div class="empty">任务库还是空的。</div>';
    }
    function renderDeptCard(dept) {
      const count = dept.id === "development" ? 2 : dept.modules.length;
      return '<button class="dept-card ' + dept.color + ' ' + (dept.id === "office" ? "art-card" : "") + '" data-nav="' + dept.id + '"><span class="dept-avatar">' + avatar(dept) + '</span><span><h4>' + dept.title + '｜' + dept.subtitle + '</h4><p>' + dept.desc + '</p><span class="card-foot">' + count + ' 个模块 →</span></span></button>';

      if (dept.id === "finance" || dept.id === "culture") return renderComing(dept);

      return renderTop(dept, "02 · " + dept.title + " / " + dept.subtitle, dept.title + "｜" + dept.subtitle, dept.desc + "。从总览进入具体模块，不再让左右两侧割裂。") +
        '<section><div class="section-head"><div><div class="section-label">模块总览</div><h3>' + dept.title + '的' + dept.modules.length + '个入口</h3></div><p>点击一个模块，进入它的任务和记录。</p></div><div class="dept-summary">' + moduleCards + '</div></section>' + body;

        '<section><div class="placeholder"><strong>' + dept.title + '正在排队</strong><p>第一版先专注日程统筹、学习进度、身体健康和长期发展。这里暂时不生成空白数据，也不制造多余操作。</p><span>即将开放</span></div></section>';
    }
    function renderEducation() {
      const books = state.books.length ? '<div class="book-list">' + state.books.map(function(book) {
        return '<div class="book-item"><div class="book-row"><div><strong>' + escapeHtml(book.title) + '</strong><p>' + escapeHtml(book.author || "未填写作者") + ' · ' + escapeHtml(book.source || "手动创建") + '</p></div><strong style="color:var(--green)">' + Number(book.progress || 0) + '%</strong></div><div class="book-progress"><div class="progress-bar"><i style="width:' + Number(book.progress || 0) + '%"></i></div></div><div class="book-actions"><button class="ghost-btn compact" data-book="' + book.id + '">继续阅读</button><button class="ghost-btn compact" data-edit-book="' + book.id + '">更新进度</button></div></div>';
      }).join("") + '</div>' : '<div class="empty">还没有书籍。可以导入 EPUB / PDF / TXT，或先手动创建一本书。</div>';
      return '<section><div class="section-head"><div><div class="section-label">学习进度</div><h3>英语与阅读，一起慢慢积累</h3></div><button class="primary-btn compact" data-action="add-book">＋ 添加书籍</button></div><div class="split-grid"><div class="panel"><div class="panel-head"><strong>英语学习</strong><span>今日任务来自办公厅</span></div><div class="detail-note">把英语拆成听力、单词、口语或阅读中的一个闭环，每天只需要完成一个小动作。</div><div class="task-list" style="margin-top:10px">' + state.tasks.filter(task => task.department === "education" && task.tag === "英语学习").map(renderCompactTask).join("") + '</div></div><div class="panel"><div class="panel-head"><strong>阅读进度</strong><span>可离线阅读记录</span></div>' + books + '</div></div></section>';
    }
    function renderCompactTask(task) {
      return '<div class="task-row ' + (completedToday(task) ? "done" : "") + '"><button class="check" data-task="' + task.id + '"></button><div><div class="task-title">' + escapeHtml(task.title) + '</div><div class="task-meta"><span class="task-tag">' + escapeHtml(task.detail) + '</span></div></div><div class="task-actions"><button data-edit-task="' + task.id + '">编辑</button></div></div>';
    }
    function renderHealth() {
      const height = Number(state.metrics.height || 0);
      const weight = Number(state.metrics.weight || 0);
      const bmi = height && weight ? (weight / Math.pow(height / 100, 2)).toFixed(1) : "—";

      document.querySelectorAll("[data-edit-task]").forEach(function(el) { el.addEventListener("click", function() { modal = { type: "task", taskId: el.dataset.editTask }; render(); }); });
      document.querySelectorAll("[data-remove]").forEach(function(el) { el.addEventListener("click", function() { const task = state.tasks.find(item => item.id === el.dataset.remove); task.selectedDates = (task.selectedDates || []).filter(date => date !== today()); persist(); render(); }); });
      document.querySelectorAll("[data-delete-task]").forEach(function(el) { el.addEventListener("click", function() { const index = state.tasks.findIndex(item => item.id === el.dataset.deleteTask); if (index < 0) return; state.trash.push({ ...state.tasks[index], deletedAt: today() }); state.tasks.splice(index, 1); persist(); render(); showToast("任务已移入回收站"); }); });
      document.querySelectorAll("[data-select]").forEach(function(el) { el.addEventListener("change", function() { const task = state.tasks.find(item => item.id === el.dataset.select); task.selectedDates = task.selectedDates || []; if (el.checked) task.selectedDates = Array.from(new Set(task.selectedDates.concat(today()))); else task.selectedDates = task.selectedDates.filter(date => date !== today()); persist(); render(); }); });
      document.querySelectorAll("[data-metric]").forEach(function(el) { el.addEventListener("change", function() { state.metrics[el.dataset.metric] = el.value; persist(); render(); }); });
      document.querySelectorAll("[data-water]").forEach(function(el) { el.addEventListener("click", function() { state.water[today()] = Number(el.dataset.water); persist(); render(); }); });
      document.querySelectorAll("[data-meal]").forEach(function(el) { el.addEventListener("change", function() { const meals = state.meals[today()] || [false, false, false]; meals[Number(el.dataset.meal)] = el.checked; state.meals[today()] = meals; persist(); render(); }); });
      document.querySelectorAll("[data-book]").forEach(function(el) { el.addEventListener("click", function() { const book = state.books.find(item => item.id === el.dataset.book); modal = { type: "book", bookId: book.id, book: book }; render(); }); });
      document.querySelectorAll("[data-edit-book]").forEach(function(el) { el.addEventListener("click", function() { const book = state.books.find(item => item.id === el.dataset.editBook); modal = { type: "book", bookId: book.id, book: book }; render(); }); });
      document.querySelectorAll("[data-edit-goal]").forEach(function(el) { el.addEventListener("click", function() { const goal = state.goals.find(item => item.id === el.dataset.editGoal); modal = { type: "goal", goalId: goal.id, goal: goal }; render(); }); });
      document.querySelectorAll("[data-action]").forEach(function(el) { el.addEventListener("click", function() { action(el.dataset.action, el.dataset); }); });
      document.querySelectorAll("[data-close]").forEach(function(el) { el.addEventListener("click", function() { modal = null; render(); }); });
      const importInput = document.querySelector("[data-import]"); if (importInput) importInput.addEventListener("change", importData);
    }
    async function action(type, data) {
      data = data || {};
      if (type === "settings") modal = { type: "settings" };
      if (type === "pick-tasks") modal = { type: "picker" };
      if (type === "add-task") modal = { type: "task", dept: data.dept || (state.activeDepartment !== "office" ? state.activeDepartment : "education"), tag: data.tag || "" };
      if (type === "add-book") modal = { type: "book" };
      if (type === "add-goal") modal = { type: "goal" };
      if (type === "edit-goal") {}
      if (type === "add-inspiration") modal = { type: "inspiration" };
      if (type === "open-module") modal = { type: "module", dept: data.dept, module: data.module };
      if (type === "analyze-inspiration") { const input = document.getElementById(data.inputId || "radar-url"); const url = input && input.value.trim(); if (!url) return showToast("先粘贴一条链接"); modal = { type: "inspiration", url: url }; }
      if (type === "water-plus") { state.water[today()] = Math.min(8, Number(state.water[today()] || 0) + 1); persist(); render(); return; }
      if (type === "water-minus") { state.water[today()] = Math.max(0, Number(state.water[today()] || 0) - 1); persist(); render(); return; }
      if (type === "reset") { if (confirm("把今天的完成状态清空吗？任务仍会保留。")) { state.tasks.forEach(task => task.doneDates = (task.doneDates || []).filter(date => date !== today())); state.water[today()] = 0; state.meals[today()] = [false, false, false]; persist(); render(); showToast("今天已重置"); } return; }
      if (type === "reset-data") { if (confirm("恢复默认示例数据吗？当前本地数据会被覆盖。")) { localStorage.removeItem(STORAGE_KEY); state = clone(defaultState); modal = null; render(); showToast("已恢复默认示例"); } return; }
      if (type === "export") { exportData(); return; }
      if (type === "install") {
        if (!deferredInstallPrompt) return showToast("当前局域网地址只能添加快捷方式；部署 HTTPS 后才能安装为独立 App");
        const promptEvent = deferredInstallPrompt;
        deferredInstallPrompt = null;
        await promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        showToast(choice && choice.outcome === "accepted" ? "已开始安装阿卢工作台" : "已取消安装");
        return;
      }
      if (type === "save-task") { await saveTask(); return; }
      if (type === "save-book") { saveBook(); return; }
      if (type === "save-goal") { saveGoal(); return; }
      if (type === "save-inspiration") { await saveInspiration(); return; }
      if (modal) render();
    }
    render();
    checkBackend();
    window.addEventListener("beforeinstallprompt", function(event) { event.preventDefault(); deferredInstallPrompt = event; });
    window.addEventListener("appinstalled", function() { deferredInstallPrompt = null; showToast("阿卢工作台已安装到手机"); });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function() {});
  })();
  </script>
</body>
</html>
